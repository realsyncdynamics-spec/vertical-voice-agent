name: P2 browser budget
on:
  push:
    branches:
      - feat/voice-customer-first-hero
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  budget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/vva-browser-budget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/vva-browser-budget/package-lock.json
      - run: npm ci
      - run: npm test
