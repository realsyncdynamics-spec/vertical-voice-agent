name: Voice frontend regression
on:
  push:
    branches:
      - feat/voice-customer-first-hero
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
