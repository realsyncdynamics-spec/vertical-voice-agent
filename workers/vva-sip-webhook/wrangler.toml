name = "vva-sip-webhook"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "vva_telephony_test"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallSession"]

[triggers]
crons = ["17 3 * * *"]   # Aufbewahrung (retention_days je Mandant)

[vars]
VVA_ENV = "test"
TELEPHONY_ENABLED = "false"
SIGNATURE_TOLERANCE_SEC = "300"
# Secrets nur per `wrangler secret put` – eigener Key für test und prod:
#   XAI_API_KEY, XAI_WEBHOOK_SECRET
